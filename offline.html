<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#127d7a">
  <title>ANI</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7fbfb;
      color: #18383b;
    }

    body {
      display: grid;
      min-height: 100dvh;
      margin: 0;
      place-items: center;
      padding: 24px;
    }

    main {
      display: grid;
      max-width: 460px;
      gap: 14px;
      border: 1px solid rgba(18, 125, 122, 0.2);
      border-radius: 8px;
      padding: 22px;
      background: #ffffff;
      box-shadow: 0 18px 40px rgba(23, 42, 44, 0.12);
    }

    img {
      width: 88px;
      height: 88px;
      border-radius: 24px;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      color: #1f5f64;
      font-size: 1.35rem;
    }

    p {
      line-height: 1.5;
    }

    a {
      width: fit-content;
      border-radius: 8px;
      padding: 10px 14px;
      background: #127d7a;
      color: #ffffff;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/ani-avatar.png" alt="ANI app icon">
    <h1>ANI cannot reach the network</h1>
    <p>The medical encyclopedia is installed. Reopen ANI to continue searching and studying.</p>
    <a href="/">Open ANI</a>
  </main>
</body>
</html>
